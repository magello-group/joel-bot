name: Rust CI/CD

on:
  release:
    types: [published]
  # Re-announce a release in Slack without building or deploying anything,
  # e.g. when a pre-release has been promoted to a full release.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce in Slack (e.g. v3.1.0)
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_push:
    # A manual run only announces, deploy is skipped along with this job
    if: ${{ github.event_name == 'release' }}
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login via Azure CLI
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_AUTH_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_AUTH_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

      - name: Login to Azure container registry
        run: |
          az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/joel-bot:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure container registry logout
        if: always()
        run: |
          docker logout ${{ secrets.AZURE_CONTAINER_REGISTRY }}

  deploy:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    needs:
      - build_and_push

    steps:
      - uses: actions/checkout@v7

      - name: Get last committer
        id: last_committer
        run: echo "committer=$(git log -1 --pretty=format:'%ae')" >> $GITHUB_OUTPUT

      - name: Login via Azure CLI
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_AUTH_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_AUTH_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

      - name: Deploy joel-bot Azure environment
        uses: azure/bicep-deploy@v2
        with:
          operation: create
          type: deploymentStack
          scope: subscription
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          location: swedencentral
          name: joel-bot-prod
          template-file: ./infrastructure/main.bicep
          action-on-unmanage-resources: delete
          deny-settings-mode: none
          parameters: |
            {
              "addressPrefix": "${{ vars.AZURE_ADDRESS_PREFIX }}",
              "environment": "prod",
              "imageVersion": "${{ github.ref_name }}",
              "tags": {
                "lastUpdatedBy": "${{ steps.last_committer.outputs.committer }}",
                "version": "${{ github.ref_name }}"
              }
            }

  announce:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to mark the release as announced

    needs:
      - deploy
    # A release is announced once it is deployed, but not betas, whether or not
    # they are marked as pre-release. A manual run is always announced.
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (
      needs.deploy.result == 'success'
      && !github.event.release.prerelease
      && !contains(github.event.release.tag_name, '-'))) }}

    steps:
      - name: Announce release in Slack
        shell: bash # enables pipefail, so a jq failure isn't masked by curl
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SLACK_RELEASE_HOOK_URL: ${{ secrets.SLACK_RELEASE_HOOK_URL }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          # Added to the release notes once announced, so a re-run doesn't post again
          MARKER: 📣 Announced in Slack
        run: |
          url=$(gh release view "$TAG" --json url --jq .url)
          body=$(gh release view "$TAG" --json body --jq .body)

          if grep -qF "$MARKER" <<< "$body"; then
            echo "::notice::$TAG is already announced in Slack, skipping"
            exit 0
          fi

          jq -n --arg tag "$TAG" --arg url "$url" \
            '{text: ":joel: Ett \($tag)-faldigt leve för Joel-bot! Han leve!\nHurra! Hurra! Hurra! 🥳\n<\($url)|Se release-notes>"}' \
            | curl --fail-with-body -sS --max-time 30 --retry 3 -X POST -H 'Content-type: application/json' --data @- "$SLACK_RELEASE_HOOK_URL"

          printf '%s\n\n%s\n' "$body" "$MARKER" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
