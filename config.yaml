      - "Ho ho ho... nej, fel högtid. Har har hare! 🐇🥚 :joel:"
      - "Glad påsk! Hoppas ni hittar alla ägg, och alla projektkoder. 🐣"
      - "Jag hoppar iväg nu. Hare-lelujah, vad jag älskar påsk! 🐇"
      - "Vi ses efter påsk! Jag är en bot, så jag jobbar förstås över helgen. 🐇"
    valborg:
      - "Ha en trevlig valborg! Sjung högt, tidrapportera tyst. 🎶"
      - "Ha en trevlig valborg! Glöm inte att rapportera innan kören drar igång. 🎶"
      - "Glad valborg! Skål för alla som hann rapportera i tid. 🥂"
      - "Trevlig valborg! Ta med en varm tröja, bålet värmer bara framsidan. 🧥"
    midsommar:
      - "Små grodorna, små grodorna, är lustiga att se! Kvack kvack, vi hörs nästa månad! 🐸"
      - "Ha en fin sommar! Jag räknar bitar, ni kan räkna jordgubbar. 🍓"
      - "Ha en fin sommar! Lägg in timmarna, lägg ifrån er mobilen och lägg er i hängmattan. 🍹"
      - "Nu lämnar jag er till sommaren. Själv stannar jag i serverhallen, där det alltid är svalt. ❄️"
    semester:
      - "Hej då, och ha en skön sommar! Hälsa solen från mig, själv får jag nöja mig med lysdioder. 🌞"
      - "Ha en skön sommar! Packa solkräm, badbyxor och en färdig tidrapport. 🏝️"
      - "Hej då! Jag håller ställningarna medan ni badar. Det är ju vad en bot är till för. 🌊"
      - "Nu går jag på semester, i alla fall mentalt. Ses i augusti! 🏖️"
    kraftskiva:
      - "Helan går! Och tidrapporten gick först. 🍻"
      - "Skål! Och kom ihåg: ingen tidrapport lämnas in efter tredje snapsen. 🍻"
      - "Smaklig spis! Sug gärna i huvudet på kräftan, men låt inte tidrapporten suga. 🍽️"
      - "Glad kräftskiva! Må alla era skal vara knäckta och alla era tidrapporter inskickade. 🍻"
    halloween:
      - "Nu går jag och gömmer mig under en spindelväv. Hej då! 🕷️"
      - "Ha en kuslig kväll! Men håll er borta från `unsafe`, det är där de riktiga monstren bor. 🕸️"
      - "Må er kväll vara fylld av godis och fri från segfaults. 🍬🎃"
      - "Hej då! Om något säger 'buh' i kväll, kolla att det inte är en glömd tidrapport. 🪦"
    12:
